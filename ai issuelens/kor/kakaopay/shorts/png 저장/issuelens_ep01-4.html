<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IssueLens EP.01-4 — 이게 공정한 거래입니까?</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a0a;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 16px;
}
.card{
  position:relative;width:390px;height:693px;
  overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.9);
  display:flex;flex-direction:column;
}

/* 상단 바 */
.top-bar{
  width:100%;background:#CC0000;height:160px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
}
.top-bar::after{content:'';position:absolute;right:-30px;top:-40px;width:130px;height:220px;background:rgba(255,255,255,.07);transform:rotate(18deg);}
.top-bar::before{content:'';position:absolute;left:-20px;bottom:-30px;width:100px;height:160px;background:rgba(0,0,0,.15);transform:rotate(18deg);}
.top-text{
  font-size:46px;font-weight:900;color:#fff;
  text-align:center;text-shadow:2px 3px 0 rgba(0,0,0,.45);
  letter-spacing:-.02em;line-height:1.18;padding:0 18px;
  word-break:keep-all;position:relative;z-index:2;
}

/* 중앙 */
.mid{
  flex:1;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;
  background:
    radial-gradient(ellipse 60% 50% at 78% 55%, rgba(160,100,0,.5) 0%, transparent 68%),
    radial-gradient(ellipse 65% 45% at 22% 35%, rgba(10,50,120,.6) 0%, transparent 70%),
    #07080e;
}
.deco-circle{
  position:absolute;width:210px;height:210px;border-radius:50%;
  top:50%;right:8%;transform:translateY(-50%);
  background:rgba(200,130,0,.45);opacity:.35;pointer-events:none;
}
.deco-rect{
  position:absolute;width:160px;height:240px;
  top:6%;left:-20px;transform:rotate(-11deg);
  background:rgba(40,25,0,.9);opacity:.18;pointer-events:none;
}

/* 저울 일러스트 */
.scale-wrap{
  position:absolute;top:50%;left:3%;
  transform:translateY(-50%);
  width:150px;height:170px;
  pointer-events:none;z-index:2;
  display:flex;flex-direction:column;align-items:center;
}
.scale-pole{width:3px;height:44px;background:#777;margin:0 auto}
.scale-beam{
  width:136px;height:3px;
  background:linear-gradient(90deg,#999,#777);
  border-radius:2px;
  position:relative;
  transform:rotate(-14deg);
  transform-origin:center;
  margin-top:0;
}
.scale-chain{
  position:absolute;bottom:0;
  width:2px;height:52px;background:#666;
}
.scale-chain.l{left:2px;transform:translateY(100%)}
.scale-chain.r{right:2px;transform:translateY(62%)}
.scale-pan{
  position:absolute;
  width:52px;height:7px;
  background:#555;border-radius:4px;
}
.scale-pan.l{bottom:-57px;left:-25px}
.scale-pan.r{bottom:-39px;right:-25px}

/* 차단 표시 */
.block-badges{
  position:absolute;top:16px;left:5%;
  display:flex;flex-direction:column;gap:6px;
  z-index:3;pointer-events:none;
}
.block-item{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,50,50,.35);
  border-radius:6px;padding:4px 9px;
  font-size:10px;font-weight:900;color:rgba(255,120,120,.85);
  letter-spacing:.04em;
}
.block-x{color:#ff4444;font-size:11px;margin-right:1px}

/* 메인 텍스트 */
.main-block{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;margin-left:22px;
}
.m-line{
  font-weight:900;letter-spacing:-.02em;line-height:1.12;
  text-shadow:3px 3px 0 rgba(0,0,0,.9),-1px -1px 0 rgba(0,0,0,.5);
  word-break:keep-all;
}
.m-line.gold{color:#ffcc66;font-size:30px}
.m-line.red{color:#FF5555;font-size:36px}
.m-line.sm{color:#fff;font-size:24px;margin-top:8px}
.m-line.yellow{color:#FFD700;font-size:44px}

/* 하단 바 */
.bot-bar{
  width:100%;background:#CC0000;height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;flex-shrink:0;position:relative;overflow:hidden;
}
.bot-bar::before{content:'';position:absolute;left:-30px;top:-30px;width:120px;height:200px;background:rgba(255,255,255,.06);transform:rotate(18deg);}
.bot-line{
  font-size:30px;font-weight:900;color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.45);
  text-align:center;letter-spacing:-.02em;line-height:1.28;
  padding:0 12px;word-break:keep-all;position:relative;z-index:2;
}
.bot-line .acc{color:#FFD700}

.ep-badge{
  position:absolute;top:14px;right:14px;
  background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.18);
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:900;color:rgba(255,255,255,.7);
  letter-spacing:.1em;z-index:20;pointer-events:none;
}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="top-text">이게 공정한<br>거래입니까?</div>
  </div>
  <div class="mid">
    <div class="deco-circle"></div>
    <div class="deco-rect"></div>
    <div class="scale-wrap">
      <div class="scale-pole"></div>
      <div class="scale-beam">
        <div class="scale-chain l"></div>
        <div class="scale-chain r"></div>
        <div class="scale-pan l"></div>
        <div class="scale-pan r"></div>
      </div>
    </div>
    <div class="block-badges">
      <div class="block-item"><span class="block-x">✕</span> YouTube</div>
      <div class="block-item"><span class="block-x">✕</span> Google</div>
      <div class="block-item"><span class="block-x">✕</span> Kakao</div>
    </div>
    <div class="main-block">
      <div class="m-line gold">그 나라는</div>
      <div class="m-line red">유튜브 차단</div>
      <div class="m-line sm">우리 데이터는</div>
      <div class="m-line yellow">공짜 반출</div>
    </div>
  </div>
  <div class="bot-bar">
    <div class="bot-line">내 소비 선택이</div>
    <div class="bot-line"><span class="acc">데이터 주권</span>의 투표</div>
  </div>
  <div class="ep-badge">EP.01 · #4</div>
</div>

<style>
.dl-btn{
  position:fixed;bottom:20px;right:20px;z-index:999;
  background:#CC0000;color:#fff;border:none;border-radius:10px;
  padding:12px 22px;font-family:'Noto Sans KR',sans-serif;
  font-size:15px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.5);letter-spacing:.04em;
  transition:opacity .15s;
}
.dl-btn:hover{opacity:.85}
.dl-btn:active{transform:scale(.97)}
</style>
<button class="dl-btn" id="dlBtn">📥 PNG 저장</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
document.getElementById("dlBtn").addEventListener("click",function(){
  var btn=this;btn.textContent="캡처 중...";btn.disabled=true;
  var card=document.querySelector(".card");
  html2canvas(card,{
    scale:3,
    useCORS:true,
    backgroundColor:null,
    width:card.offsetWidth,
    height:card.offsetHeight,
    logging:false
  }).then(function(canvas){
    var a=document.createElement("a");
    a.download=document.title.replace(/\s+/g,"_")+".png";
    a.href=canvas.toDataURL("image/png");
    a.click();
    btn.textContent="📥 PNG 저장";btn.disabled=false;
  });
});
</script>
</body>
</html>
