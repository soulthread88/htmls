        function changeFontSize(action) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            
            if (action === 'increase') {
                span.style.fontSize = '1.2em';
            } else {
                span.style.fontSize = '0.9em';
            }
            
            range.surroundContents(span);
        }

            const color = prompt('색상을 입력하세요 (예: red, #FF0000):');
            if (color) {
                document.execCommand('foreColor', false, color);
            }
        }
        
        function uploadImage(boxNumber) {
            const input = document.getElementById('imageInput' + boxNumber);
            const file = input.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('uploadedImage' + boxNumber);
                    const placeholder = document.getElementById('imageBox' + boxNumber);
                    const description = placeholder.querySelector('.image-description');
                    const uploadBtn = placeholder.querySelector('.image-upload-btn');
                    
                    img.src = e.target.result;
                    img.style.display = 'block';
                    description.style.display = 'none';
                    uploadBtn.textContent = '🔄 다른 이미지 선택';
                };
                reader.readAsDataURL(file);
            }
        }
        
        function switchLanguage(lang) {
            document.querySelectorAll('.lang-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.lyrics-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('lyrics-' + lang).classList.add('active');
        }
        
        function togglePlay() {
            const playBtn = document.querySelector('.play-btn');
            
            if (!isPlaying) {
                isPlaying = true;
                playBtn.innerHTML = '<div class="pause-icon"><div class="pause-bar"></div><div class="pause-bar"></div></div>';
                startPlayback();
            } else {
                isPlaying = false;
                playBtn.innerHTML = '<div class="play-icon"></div>';
                stopPlayback();
            }
        }
        
        function startPlayback() {
            playInterval = setInterval(() => {
                if (currentTime < duration) {
                    currentTime++;
                    updateProgress();
                } else {
                    togglePlay();
                    currentTime = 0;
                    updateProgress();
                }
            }, 1000);
        }
        
        function stopPlayback() {
            clearInterval(playInterval);
        }
        
        function updateProgress() {
            const progressFill = document.getElementById('progressFill');
            const timeDisplay = document.getElementById('timeDisplay');
            
            const percentage = (currentTime / duration) * 100;
            progressFill.style.width = percentage + '%';
            
            const currentMin = Math.floor(currentTime / 60);
            const currentSec = currentTime % 60;
            const durationMin = Math.floor(duration / 60);
            const durationSec = duration % 60;
            
            timeDisplay.textContent = 
                `${currentMin}:${currentSec.toString().padStart(2, '0')} / ${durationMin}:${durationSec.toString().padStart(2, '0')}`;
        }
        
        function seek(event) {
            const progressBar = event.currentTarget;
            const rect = progressBar.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const percentage = x / rect.width;
            
            currentTime = Math.floor(duration * percentage);
            updateProgress();
        }
        
        updateProgress();
        
        // 달력 생성
        const holidays = {
            2025: {
                1: [1],
                2: [28, 29, 30],
                3: [1, 3],
                5: [5, 15],
                6: [6],
                8: [15],
                9: [28, 29, 30],
                10: [3, 9],
                12: [25]
            }
        };
        
        const holidayNames = {
            2025: {
                '1-1': '신정',
                '2-28': '설날',
                '2-29': '설날',
                '2-30': '설날',
                '3-1': '삼일절',
                '3-3': '대체휴일',
                '5-5': '어린이날',
                '5-15': '석가탄신일',
                '6-6': '현충일',
                '8-15': '광복절',
                '9-28': '추석',
                '9-29': '추석',
                '9-30': '추석',
                '10-3': '개천절',
                '10-9': '한글날',
                '12-25': '성탄절'
            }
        };
        
        function generateCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            
            document.getElementById('calendar-month').textContent = 
                year + '년 ' + (month + 1) + '월';
            
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
            weekDays.forEach((day, index) => {
                const dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.textContent = day;
                dayCell.style.fontWeight = '900';
                if (index === 0) {
                    dayCell.style.color = '#D32F2F';
                }
                grid.appendChild(dayCell);
            });
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const firstDayOfWeek = firstDay.getDay();
            const lastDate = lastDay.getDate();
            
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day';
                emptyCell.style.opacity = '0.3';
                grid.appendChild(emptyCell);
            }
            
            const monthHolidays = (holidays[year] && holidays[year][month + 1]) || [];
            const monthHolidayNames = holidayNames[year] || {};
            
            for (let date = 1; date <= lastDate; date++) {
                const dateCell = document.createElement('div');
                dateCell.className = 'calendar-day';
                
                const currentDate = new Date(year, month, date);
                const dayOfWeek = currentDate.getDay();
                
                if (dayOfWeek === 0) {
                    dateCell.style.color = '#D32F2F';
                }
                
                const isHoliday = monthHolidays.includes(date);
                const holidayKey = (month + 1) + '-' + date;
                const holidayName = monthHolidayNames[holidayKey];
                
                if (isHoliday && holidayName) {
                    dateCell.style.color = '#D32F2F';
                    dateCell.style.fontWeight = '900';
                    dateCell.innerHTML = date + '<br><span style="font-size: 9px;">' + holidayName + '</span>';
                } else {
                    dateCell.textContent = date;
                }
                
                if (date === now.getDate() && month === now.getMonth() && year === now.getFullYear()) {
                    dateCell.style.background = '#0066CC';
                    dateCell.style.color = 'white';
                    dateCell.style.fontWeight = '900';
                }
                
                grid.appendChild(dateCell);
            }
        }
        
        generateCalendar();
    </script>
</body>
</html>
