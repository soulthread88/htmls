<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IssueLens EP.01-3 — 해킹보다 무서운 이유</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a0a;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 16px;
}
.card{
  position:relative;width:390px;height:693px;
  overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.9);
  display:flex;flex-direction:column;
}

/* 상단 바 */
.top-bar{
  width:100%;background:#CC0000;height:160px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
}
.top-bar::after{content:'';position:absolute;right:-30px;top:-40px;width:130px;height:220px;background:rgba(255,255,255,.07);transform:rotate(18deg);}
.top-bar::before{content:'';position:absolute;left:-20px;bottom:-30px;width:100px;height:160px;background:rgba(0,0,0,.15);transform:rotate(18deg);}
.top-text{
  font-size:50px;font-weight:900;color:#fff;
  text-align:center;text-shadow:2px 3px 0 rgba(0,0,0,.45);
  letter-spacing:-.02em;line-height:1.18;padding:0 18px;
  word-break:keep-all;position:relative;z-index:2;
}

/* 중앙 */
.mid{
  flex:1;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;
  background:
    radial-gradient(ellipse 65% 50% at 15% 50%, rgba(0,60,30,.7) 0%, transparent 65%),
    radial-gradient(ellipse 55% 45% at 85% 40%, rgba(80,0,120,.55) 0%, transparent 68%),
    #050810;
}
.deco-circle{
  position:absolute;width:210px;height:210px;border-radius:50%;
  top:50%;left:10%;transform:translateY(-50%);
  background:rgba(0,140,70,.45);opacity:.35;pointer-events:none;
}
.deco-rect{
  position:absolute;width:160px;height:240px;
  top:6%;right:-20px;transform:rotate(11deg);
  background:rgba(0,30,15,.9);opacity:.18;pointer-events:none;
}

/* 방패 일러스트 */
.shield-wrap{
  position:absolute;top:50%;left:4%;
  transform:translateY(-50%) rotate(-6deg);
  width:124px;height:148px;
  pointer-events:none;z-index:2;
}
.shield-body{
  width:100%;height:100%;
  background:linear-gradient(145deg,#1a3520,#0d1e14);
  border:2.5px solid #2a5535;
  clip-path:polygon(50% 100%,0% 35%,0% 0%,100% 0%,100% 35%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.7);
}
.shield-x{
  font-size:52px;font-weight:900;color:#ff3333;
  text-shadow:0 0 14px rgba(255,50,50,.7);
  margin-top:-16px;
}

/* 법조문 카드 */
.law-card{
  position:absolute;
  bottom:18px;left:6%;
  width:130px;
  background:rgba(0,20,10,.85);
  border:1px solid rgba(0,180,80,.3);
  border-radius:8px;
  padding:8px 10px;
  font-size:9px;font-weight:700;
  color:rgba(100,255,150,.7);
  line-height:1.5;
  letter-spacing:.03em;
  pointer-events:none;z-index:3;
}
.law-card span{color:#ff4444;font-size:10px}

/* 메인 텍스트 */
.main-block{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;margin-left:26px;
}
.m-line{
  font-weight:900;letter-spacing:-.02em;line-height:1.12;
  text-shadow:3px 3px 0 rgba(0,0,0,.9),-1px -1px 0 rgba(0,0,0,.5);
  word-break:keep-all;
}
.m-line.green{color:#aaffcc;font-size:34px}
.m-line.yellow{color:#FFD700;font-size:58px}
.m-line.white{color:#fff;font-size:28px;line-height:1.3}

/* 하단 바 */
.bot-bar{
  width:100%;background:#CC0000;height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;flex-shrink:0;position:relative;overflow:hidden;
}
.bot-bar::before{content:'';position:absolute;left:-30px;top:-30px;width:120px;height:200px;background:rgba(255,255,255,.06);transform:rotate(18deg);}
.bot-line{
  font-size:30px;font-weight:900;color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.45);
  text-align:center;letter-spacing:-.02em;line-height:1.28;
  padding:0 12px;word-break:keep-all;position:relative;z-index:2;
}
.bot-line .acc{color:#FFD700}

.ep-badge{
  position:absolute;top:14px;right:14px;
  background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.18);
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:900;color:rgba(255,255,255,.7);
  letter-spacing:.1em;z-index:20;pointer-events:none;
}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="top-text">해킹보다<br>무서운 이유</div>
  </div>
  <div class="mid">
    <div class="deco-circle"></div>
    <div class="deco-rect"></div>
    <div class="shield-wrap">
      <div class="shield-body">
        <div class="shield-x">!</div>
      </div>
    </div>
    <div class="law-card">
      <span>국가정보법 제7조</span><br>
      모든 조직·시민은<br>국가 정보 활동에<br>협조해야 한다.
    </div>
    <div class="main-block">
      <div class="m-line green">국가정보법</div>
      <div class="m-line yellow">제7조</div>
      <div class="m-line white">모든 조직·시민은<br>협조해야 한다</div>
    </div>
  </div>
  <div class="bot-bar">
    <div class="bot-line">당신의 <span class="acc">개인정보</span>는</div>
    <div class="bot-line">당신만의 것이 아닙니다</div>
  </div>
  <div class="ep-badge">EP.01 · #3</div>
</div>

<style>
.dl-btn{
  position:fixed;bottom:20px;right:20px;z-index:999;
  background:#CC0000;color:#fff;border:none;border-radius:10px;
  padding:12px 22px;font-family:'Noto Sans KR',sans-serif;
  font-size:15px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.5);letter-spacing:.04em;
  transition:opacity .15s;
}
.dl-btn:hover{opacity:.85}
.dl-btn:active{transform:scale(.97)}
</style>
<button class="dl-btn" id="dlBtn">📥 PNG 저장</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
document.getElementById("dlBtn").addEventListener("click",function(){
  var btn=this;btn.textContent="캡처 중...";btn.disabled=true;
  var card=document.querySelector(".card");
  html2canvas(card,{
    scale:3,
    useCORS:true,
    backgroundColor:null,
    width:card.offsetWidth,
    height:card.offsetHeight,
    logging:false
  }).then(function(canvas){
    var a=document.createElement("a");
    a.download=document.title.replace(/\s+/g,"_")+".png";
    a.href=canvas.toDataURL("image/png");
    a.click();
    btn.textContent="📥 PNG 저장";btn.disabled=false;
  });
});
</script>
</body>
</html>
