<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IssueLens INSTA EP.01-3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#111;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.card{
  position:relative;width:390px;height:390px;
  overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.95);
}

.bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 65% 55% at 14% 52%, rgba(0,60,30,.75) 0%, transparent 62%),
    radial-gradient(ellipse 55% 50% at 86% 40%, rgba(80,0,120,.6) 0%, transparent 66%),
    #050810;
}

.corner-tl{
  position:absolute;top:0;left:0;width:0;height:0;
  border-style:solid;border-width:100px 100px 0 0;
  border-color:#CC0000 transparent transparent transparent;z-index:2;
}
.corner-br{
  position:absolute;bottom:0;right:0;width:0;height:0;
  border-style:solid;border-width:0 0 80px 80px;
  border-color:transparent transparent #CC0000 transparent;z-index:2;
}

.ep-badge{
  position:absolute;top:10px;left:10px;
  font-size:10px;font-weight:900;color:rgba(255,255,255,.9);
  letter-spacing:.14em;z-index:10;text-shadow:1px 1px 0 rgba(0,0,0,.6);
}
.handle{
  position:absolute;top:24px;left:10px;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.7);
  letter-spacing:.06em;z-index:10;
}

/* 방패 */
.shield-wrap{
  position:absolute;left:12px;top:50%;
  transform:translateY(-52%) rotate(-6deg);
  width:116px;height:138px;z-index:3;
}
.shield-body{
  width:100%;height:100%;
  background:linear-gradient(145deg,#1a3520,#0d1e14);
  border:2.5px solid #2a5535;
  clip-path:polygon(50% 100%,0% 35%,0% 0%,100% 0%,100% 35%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(0,0,0,.8);
}
.shield-x{
  font-size:50px;font-weight:900;color:#ff3333;
  text-shadow:0 0 16px rgba(255,50,50,.75);
  margin-top:-14px;
}

/* 왼쪽 대체 텍스트 블록 */
.left-alt{
  position:absolute;left:10px;bottom:110px;
  width:136px;z-index:4;
  display:flex;flex-direction:column;gap:2px;
}
.la-line{
  font-size:28px;font-weight:900;
  letter-spacing:-.03em;line-height:1.15;
  word-break:keep-all;
}
.la-line.red{color:#FF4444;text-shadow:2px 2px 0 rgba(0,0,0,.9),0 0 12px rgba(255,50,50,.4);}
.la-line.wht{color:rgba(255,255,255,.9);text-shadow:2px 2px 0 rgba(0,0,0,.9);}

.main{
  position:absolute;right:12px;top:50%;transform:translateY(-66%);
  width:200px;text-align:center;z-index:10;
}
.label{
  font-size:38px;font-weight:900;color:#fff;
  letter-spacing:-.03em;line-height:1.08;
  word-break:keep-all;
  text-shadow:3px 3px 0 rgba(0,0,0,.95),-1px -1px 0 rgba(0,0,0,.5);
  margin-bottom:10px;
}
.m-line{
  font-weight:900;letter-spacing:-.02em;line-height:1.1;
  word-break:keep-all;
  text-shadow:2px 2px 0 rgba(0,0,0,.9),-1px -1px 0 rgba(0,0,0,.5);
}
.m-green{color:#aaffcc;font-size:26px}
.m-yellow{color:#FFD700;font-size:50px}
.m-white{color:#fff;font-size:23px;line-height:1.3}

.strip{
  position:absolute;bottom:0;left:0;right:0;height:48px;
  background:#CC0000;
  display:flex;align-items:center;justify-content:center;z-index:5;
}
.strip-text{font-size:17px;font-weight:900;color:#fff;letter-spacing:-.02em;text-shadow:1px 1px 0 rgba(0,0,0,.4);text-align:center;padding:0 12px;}
.strip-text .acc{color:#FFD700}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="ep-badge">EP.01 · #3</div>
  <div class="handle">@issuelens</div>
  <div class="shield-wrap">
    <div class="shield-body"><div class="shield-x"></div></div>
  </div>
  <div class="left-alt">
    <div class="la-line red">거부할</div>
    <div class="la-line red">수 없다</div>
    <div class="la-line wht">법적 의무!</div>
  </div>
  <div class="main">
    <div class="label">National<br>Intelligence Law</div>
    <div class="m-line m-yellow">제7조</div>
    <div style="height:1em"></div>
    <div class="m-line m-white">모든<br>조직·시민은<br>협조해야 한다</div>
  </div>
  <div class="strip">
    <div class="strip-text">당신의 <span class="acc">개인정보</span>는 당신만의 것이 아닙니다</div>
  </div>
</div>
</body>
</html>
