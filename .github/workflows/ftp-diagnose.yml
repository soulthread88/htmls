name: FTP diagnose
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FTP
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf 'machine %s login %s password %s\n' "$H" "$U" "$P" > ~/.netrc; chmod 600 ~/.netrc
          echo "runner IP: $(curl -s https://api.ipify.org)"
          echo "== PWD / root listing"; curl -sS --netrc -v "ftp://$H/" 2>&1 | grep -E '^< 2[0-9]{2} |^< 5|^[d-]' | grep -v PASS | head -40 || true
          echo "== www listing"; curl -sS --netrc "ftp://$H/www/" 2>&1 | head -40 || true
          echo "== www/uno listing"; curl -sS --netrc "ftp://$H/www/uno/" 2>&1 | head -20 || true
          echo test > probe.txt
          echo "== upload to www/"; curl -sS --netrc -T probe.txt "ftp://$H/www/probe.txt" -w '%{response_code}\n' 2>&1 || true
          echo "== upload to www/uno/"; curl -sS --netrc -T probe.txt "ftp://$H/www/uno/probe.txt" -w '%{response_code}\n' 2>&1 || true
          echo "== upload to home root"; curl -sS --netrc -T probe.txt "ftp://$H/probe.txt" -w '%{response_code}\n' 2>&1 || true
          echo "== cleanup"; for f in www/probe.txt www/uno/probe.txt probe.txt; do curl -sS --netrc "ftp://$H/" -Q "DELE $f" -o /dev/null 2>&1 || true; done
          rm -f ~/.netrc
