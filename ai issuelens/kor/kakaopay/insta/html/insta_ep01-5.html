<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IssueLens INSTA EP.01-5</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#111;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.card{
  position:relative;width:390px;height:390px;
  overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.95);
}

.bg{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 60% 48% at 20% 60%, rgba(0,100,80,.55) 0%, transparent 65%),
    radial-gradient(ellipse 58% 50% at 80% 30%, rgba(150,50,0,.55) 0%, transparent 68%),
    #060a09;
}

.corner-tl{
  position:absolute;top:0;left:0;width:0;height:0;
  border-style:solid;border-width:100px 100px 0 0;
  border-color:#CC0000 transparent transparent transparent;z-index:2;
}
.corner-br{
  position:absolute;bottom:0;right:0;width:0;height:0;
  border-style:solid;border-width:0 0 80px 80px;
  border-color:transparent transparent #CC0000 transparent;z-index:2;
}

.ep-badge{
  position:absolute;top:10px;left:10px;
  font-size:10px;font-weight:900;color:rgba(255,255,255,.9);
  letter-spacing:.14em;z-index:10;text-shadow:1px 1px 0 rgba(0,0,0,.6);
}
.handle{
  position:absolute;bottom:8px;right:12px;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.7);
  letter-spacing:.06em;z-index:10;
}

/* ── 좌측 타이틀 (체크리스트 바로 위) ── */
.left-title{
  position:absolute;
  top:118px;left:14px;
  width:152px;
  z-index:10;
}
.lt-label{
  display:inline-block;
  background:#CC0000;
  font-size:9px;font-weight:900;color:#fff;
  letter-spacing:.12em;padding:2px 8px;border-radius:2px;
  margin-bottom:6px;
  text-transform:uppercase;
}
.lt-text{
  font-size:23px;font-weight:900;
  color:#FFD700;
  letter-spacing:-.03em;line-height:1.15;
  word-break:keep-all;
  text-shadow:2px 2px 0 rgba(0,0,0,.95),-1px -1px 0 rgba(0,0,0,.5);
}

/* ── 체크리스트 박스 ── */
.checklist{
  position:absolute;left:12px;top:185px;
  width:152px;z-index:3;
  background:rgba(255,255,255,.03);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;
  padding:12px 13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
}
.cl-title{
  font-size:9px;font-weight:900;color:rgba(255,255,255,.4);
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:7px;
  border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:6px;
}
.cl-item{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:rgba(255,255,255,.85);
  margin-top:8px;
}
.cl-box{
  width:21px;height:21px;border-radius:5px;
  background:#00c875;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:12px;color:#fff;
  box-shadow:0 2px 6px rgba(0,200,117,.35);
}

/* ── 우측 메인 텍스트 ── */
.main{
  position:absolute;right:12px;top:50%;
  transform:translateY(-54%);
  width:204px;text-align:center;z-index:10;
}

/* 4 + 가지 가로 정렬 */
.num-row{
  display:flex;align-items:center;justify-content:center;
  gap:6px;
}
.num-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:50%;
  background:#00c875;font-size:22px;font-weight:900;color:#fff;
  box-shadow:0 3px 12px rgba(0,200,117,.45);
  flex-shrink:0;
}
.m-line{
  font-weight:900;letter-spacing:-.02em;line-height:1.1;
  word-break:keep-all;
  text-shadow:2px 2px 0 rgba(0,0,0,.9),-1px -1px 0 rgba(0,0,0,.5);
}
.m-yellow{color:#FFD700;font-size:56px}
.m-white{color:#fff;font-size:34px;margin-top:4px}
.m-practice{color:#fff;font-size:30px;margin-top:2px}

/* ── 하단 스트립 ── */
.strip{
  position:absolute;bottom:0;left:0;right:0;height:52px;
  background:#CC0000;
  display:flex;align-items:center;justify-content:center;z-index:5;
}
.strip-text{
  font-size:19px;font-weight:900;color:#fff;
  letter-spacing:-.02em;text-shadow:1px 1px 0 rgba(0,0,0,.4);
}
.strip-text .acc{color:#FFD700}
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="ep-badge">EP.01 · #5</div>
  <div class="handle">@issuelens</div>

  <!-- 좌측: 대형 타이틀 -->
  <div class="left-title">
    <div class="lt-text">지금 당장<br>할 수 있는 것</div>
  </div>

  <!-- 좌측: Action List 박스 (아래로) -->
  <div class="checklist">
    <div class="cl-title">Action List</div>
    <div class="cl-item"><div class="cl-box">✓</div>앱 삭제</div>
    <div class="cl-item"><div class="cl-box">✓</div>권한 차단</div>
    <div class="cl-item"><div class="cl-box">✓</div>국내 플랫폼</div>
    <div class="cl-item"><div class="cl-box">✓</div>가족 공유</div>
  </div>

  <!-- 우측: 4가지 + 실천 -->
  <div class="main">
    <div class="num-badge">4</div>
    <div class="m-line m-yellow">가지</div>
    <div class="m-line m-white">지금 바로</div>
    <div class="m-line m-practice">실천하세요</div>
  </div>

  <div class="strip">
    <div class="strip-text">알아야 <span class="acc">지킬 수 있습니다</span></div>
  </div>
</div>
</body>
</html>
