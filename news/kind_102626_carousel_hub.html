;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/e1333c238c424bf99257cf92cee1bf43.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;제재도 다리도, 다들 행간을 읽는 중.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;북·중 관계는 대북 제재 이행과 한반도 안보에 영향을 줍니다. 국내 언론은 신압록강대교를 경제협력 확대의 계기로 짚었습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 찬성 / 반대&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;찬성 ✔&lt;/b&gt;대화 채널이 복원되면 역내 긴장 관리에 도움이 된다(일부 전문가 해석).&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;반대 ✖&lt;/b&gt;교역 확대가 제재 실효성을 약화시킬 수 있다(일부 전문가 해석).&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;미확인이면 추측은 짧은 줄에 묶어 두세요.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;미확인이면 추측은 짧은 줄에 묶어 두세요.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;회담 급과 후속 합의는 공식 확인되지 않았습니다. 해석은 잠정적으로 보세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://news.sbs.co.kr/news/programMain.do?prog_cd=R1&amp;broad_date=20261025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SBS 8뉴스 2026.10.25&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;매일 한국 뉴스를 무료로&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;구독하기 →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t02_cover.jpg&quot; alt=&quot;오세훈 · 보수&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ac8f9c67832741dcabc913a0bcaa0458.jpg&#x27;&quot;&gt;&lt;figcaption&gt;일러스트: KIND 시사만화 · AI 생성(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;h2&gt;오세훈 무죄 선고 이후, 보수 구심점 논의&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;넘겨 보기 →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;사실&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t02_fact.jpg&quot; alt=&quot;판결 하나, 덕담 한마디, 다시 그려지는 지도.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b7ccb22302784a1db3ffbe7b13030adc.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;판결 하나, 덕담 한마디, 다시 그려지는 지도.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;무죄 선고 뒤 한동훈 의원은 오 시장을 “굉장히 합리적인 분”이라며 보수 승리를 위해 함께 가야 한다고 밝혔고, 홍준표 전 대구시장도 입장을 냈습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;배경&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t02_bg.jpg&quot; alt=&quot;정당은 재편하고, 유권자는 성적표를 지켜봅니다.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/8e6a442dea5d4d33a968ebb1d1853c62.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;정당은 재편하고, 유권자는 성적표를 지켜봅니다.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;국내 언론은 보수 진영의 재편 움직임을 전합니다. 판결은 여러 요인 중 하나입니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;결정은 법원과 정당이, 우리는 사실만.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;결정은 법원과 정당이, 우리는 사실만.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;다음 수순은 법원과 정당이 정합니다. 확인된 사실에 머무르세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=pol&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네이트 랭킹뉴스(정치) 2026.10.25&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;매일 한국 뉴스를 무료로&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;구독하기 →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t03_cover.jpg&quot; alt=&quot;최형우 · 조문&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/48327939c53346b89f295124ba92c614.jpg&#x27;&quot;&gt;&lt;figcaption&gt;일러스트: KIND 시사만화 · AI 생성(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;h2&gt;최형우 전 내무부 장관 별세…여야 조문&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;넘겨 보기 →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;사실&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t03_fact.jpg&quot; alt=&quot;여야가 한자리에 모인 빈소.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/7e4ff542e0264d03a292e50d13d06fd1.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;여야가 한자리에 모인 빈소.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;YS 최측근으로 알려진 최형우 전 내무부 장관이 향년 91세로 별세했고, 빈소에는 여야 정치권 인사의 조문이 이어졌다고 보도됐습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;배경&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t03_bg.jpg&quot; alt=&quot;애도는 입장을 넘어서는 시간.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/eed673010c9d4cc7849dc0068b64f407.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;애도는 입장을 넘어서는 시간.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;정치적 입장과 관계없이 조문이 이어졌다는 점이 전해졌습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;평가는 다양해도 보도된 사실부터.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;평가는 다양해도 보도된 사실부터.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;고인에 대한 평가는 다양합니다. 보도된 사실부터 확인하세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://www.specialtimes.co.kr/news/articleView.html?idxno=478201&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;스페셜타임스 아침브리핑 2026.10.25&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;매일 한국 뉴스를 무료로&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;구독하기 →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t04_cover.jpg&quot; alt=&quot;법무부 · 장관&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/7a6f871391d44147bdd6f4147854cd06.jpg&#x27;&quot;&gt;&lt;figcaption&gt;일러스트: KIND 시사만화 · AI 생성(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;h2&gt;법무부 장관 후보 2인 압축…검찰 출신 인선 검토&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;넘겨 보기 →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;사실&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t04_fact.jpg&quot; alt=&quot;후보 두 명, 고민은 한 보따리.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ed3e9d9a1af6474388802b492ad2f090.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;후보 두 명, 고민은 한 보따리.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;이재명 대통령이 박균택·양부남 의원을 두고 막판 고심 중이라는 보도가 나왔습니다. 두 의원 모두 검찰 출신입니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;배경&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t04_bg.jpg&quot; alt=&quot;간판 하나 바꾸는 데도 2억 7천만 원.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b9f1542a37ad415396ba16c40faf0dd4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;간판 하나 바꾸는 데도 2억 7천만 원.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;검찰 개혁 방향과 맞물려 인선의 상징성이 큽니다. 같은 날 “아직도 곳곳에 ‘검찰청’ 표지판…교체 비용 2억7000만원” 기사도 관심을 모았습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 찬성 / 반대&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;찬성 ✔&lt;/b&gt;수사·사법 실무를 아는 인사가 개혁을 현실적으로 설계할 수 있다는 입장.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;반대 ✖&lt;/b&gt;검찰 출신 기용이 개혁 취지와 맞는지 의문이라는 입장.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;발표 전까지는 모두 추측입니다.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;발표 전까지는 모두 추측입니다.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;인선은 공식 발표 전입니다. 발표를 확인하세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=pol&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네이트 랭킹뉴스(정치) 2026.10.25&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;매일 한국 뉴스를 무료로&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;구독하기 →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t05_cover.jpg&quot; alt=&quot;태풍 참피 · 제주&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/999328fc484a4969b6d8e8148c2da908.jpg&#x27;&quot;&gt;&lt;figcaption&gt;일러스트: KIND 시사만화 · AI 생성(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;h2&gt;태풍 참피 북상…제주 가장 늦은 태풍경보&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;넘겨 보기 →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;사실&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t05_fact.jpg&quot; alt=&quot;역대 가장 늦은 태풍경보. 날씨도 지각?&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/a716a874bc7742e4be6512e8b137bef7.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;역대 가장 늦은 태풍경보. 날씨도 지각?&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;SBS는 제주에 340㎜ 폭우가 내리고 태풍경보가 역대 가장 늦은 시기에 발령됐다고 전했습니다. 태풍은 약 250㎞까지 접근했습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;배경&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t05_bg.jpg&quot; alt=&quot;우산과 함께 운항 정보도 챙기세요.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4eda8559adae49b89969b3ce27860841.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;우산과 함께 운항 정보도 챙기세요.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;오키나와와 대만에서도 피해가 났습니다. 제주 방문 예정이라면 항공·여객선 운항을 확인하세요.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;논쟁 말고 안전 확인부터.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;논쟁 말고 안전 확인부터.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;안전 사안이라 찬반 없이 공지 확인이 우선입니다.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://news.sbs.co.kr/news/programMain.do?prog_cd=R1&amp;broad_date=20261025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SBS 8뉴스 2026.10.25&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;매일 한국 뉴스를 무료로&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;구독하기 →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t06_cover.jpg&quot; alt=&quot;정년연장 · 연금&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/792512e6607e4ff8a4aabb7ee4bbbc1a.jpg&#x27;&quot;&gt;&lt;figcaption&gt;일러스트: KIND 시사만화 · AI 생성(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;h2&gt;파리는 시위, 한국은 88% 찬성…정년연장 온도차&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;넘겨 보기 →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;사실&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t06_fact.jpg&quot; alt=&quot;파리는 거리로, 서울은 88% 찬성. 같은 질문 다른 날씨.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b018c1e64a11494cba02ef87a886208b.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;파리는 거리로, 서울은 88% 찬성. 같은 질문 다른 날씨.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;SBS는 프랑스에서 시위 금지에도 약 41만 명이 모였다고 전했고, 한국에서는 정년연장 찬성이 88%라는 보도가 나왔습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;배경&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t06_bg.jpg&quot; alt=&quot;고령화엔 모두 동의, 언제 어떻게는 다른 문제.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ffbbc12202c94dd599e81ca9c3b0aadc.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;고령화엔 모두 동의, 언제 어떻게는 다른 문제.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;양국 모두 고령화를 겪지만, 거리 시위와 여론조사 찬성이라는 온도 차가 화제였습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 찬성 / 반대&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;찬성 ✔&lt;/b&gt;일하는 기간을 늘리면 소득 공백을 줄이고 숙련 인력을 활용할 수 있다.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;반대 ✖&lt;/b&gt;청년 일자리 감소와 기업 인건비 부담을 우려한다.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;설문 문항부터 읽고 박수 치세요.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;설문 문항부터 읽고 박수 치세요.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;설문 문항에 따라 결과가 달라집니다. 원문 조사를 확인하세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=sisa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네이트 랭킹뉴스(종합) 2026.10.25&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;매일 한국 뉴스를 무료로&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;구독하기 →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t07_cover.jpg&quot; alt=&quot;가상자산 · 과세&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/9ca1939934e848a584be8b3981f21ba2.jpg&#x27;&quot;&gt;&lt;figcaption&gt;일러스트: KIND 시사만화 · AI 생성(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;h2&gt;가상자산 과세 재유예 논의…청와대 “검토 중”&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;넘겨 보기 →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;사실&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t07_fact.jpg&quot; alt=&quot;가상자산 과세, 또 스누즈?&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c50cb63ccdac471b984979f0d1c7cd1f.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;가상자산 과세, 또 스누즈?&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;한동훈 의원이 가상자산 과세 재유예를 환영했고 청와대는 검토 중이라고 밝혔습니다. 삼성전자 내년 배당은 주당 1만2000원, 낙관 시 1만8000원 전망입니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;배경&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t07_bg.jpg&quot; alt=&quot;전 세계 투자자, 뉴스 새로고침 중.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/5216e47524d54031bb5317916ee359b4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;전 세계 투자자, 뉴스 새로고침 중.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;시장 제도와 투자자 보호, 과세 형평성이 함께 걸린 사안입니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 찬성 / 반대&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;찬성 ✔&lt;/b&gt;시장 인프라·투자자 보호를 갖출 시간이 필요하다.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;반대 ✖&lt;/b&gt;과세 형평을 위해 예정대로 시행해야 한다.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;결정 전엔 소문으로 매매하지 마세요.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;결정 전엔 소문으로 매매하지 마세요.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;결정은 발표되지 않았습니다. 공식 발표를 기다리세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt &lt;img src=&quot;img/kind_102626_t08_bg.jpg&quot; alt=&quot;일자리는 여기, 고향은 저기. 줄다리기의 고전.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/423e558edf2e4a968b0e8d7f19f99c4c.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;일자리는 여기, 고향은 저기. 줄다리기의 고전.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;소득과 일자리가 청년을 수도권으로 끌어당기는 구조가 다시 조명됐습니다.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 찬성 / 반대&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;찬성 ✔&lt;/b&gt;수도권 일자리가 소득 상승 기회가 된다.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;반대 ✖&lt;/b&gt;수도권 집중이 지방 소멸을 심화시킨다.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;판단&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;누구를 센 숫자인지 확인하세요.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;누구를 센 숫자인지 확인하세요.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;누구를 대상으로 한 수치인지 원문에서 확인하세요.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;출처: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=sisa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네이트 랭킹뉴스(종합) ot;&gt;&lt;div class=&quot;lb&quot;&gt;FACTS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t01_fact.jpg&quot; alt=&quot;One day trip, a thousand headlines.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4d8f350125094b2d9c4a35a2c4f3fa39.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;One day trip, a thousand headlines.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Reports on Oct 25 said Kim made a day trip to Dandong, China. He met Wang Huning, China&amp;#x27;s No. 4 official, but not Xi Jinping, and visited a Korean War memorial hall.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;WHY IT MATTERS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t01_bg.jpg&quot; alt=&quot;Sanctions, bridges, ties… everyone reads between the lines.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/e1333c238c424bf99257cf92cee1bf43.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Sanctions, bridges, ties… everyone reads between the lines.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Beijing–Pyongyang ties shape sanctions enforcement and Korean Peninsula security. Korean media also pointed to the New Yalu River Bridge as a possible route to wider economic cooperation.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ PRO / CON&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;PRO ✔&lt;/b&gt;Restored channels could help manage regional tension (some analysts).&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;CON ✖&lt;/b&gt;More trade could weaken sanctions enforcement (some analysts).&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;JUDGMENT&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;Unconfirmed? Keep the guesses on a short leash.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Unconfirmed? Keep the guesses on a short leash.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;The meeting level and any follow-up deals are not officially confirmed. Treat interpretations as provisional.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;Source: &lt;a href=&quot;https://news.sbs.co.kr/news/programMain.do?prog_cd=R1&amp;broad_date=20261025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SBS 8 News, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;Get KIND free, daily Korea news&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;Subscribe →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t05_cover.jpg&quot; alt=&quot;Typhoon Champi · Jeju&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/999328fc484a4969b6d8e8148c2da908.jpg&#x27;&quot;&gt;&lt;figcaption&gt;Illustration: KIND editorial cartoon · AI-generated (Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;h2&gt;Typhoon Champi: Jeju Gets a Record-Late Typhoon Warning&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;Swipe →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;FACTS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t05_fact.jpg&quot; alt=&quot;Latest typhoon warning ever. Even the weather runs late.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/a716a874bc7742e4be6512e8b137bef7.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Latest typhoon warning ever. Even the weather runs late.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;SBS reported 340 mm of rain on Jeju and described the warning as the latest typhoon warning ever issued. The storm came within about 250 km.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;WHY IT MATTERS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t05_bg.jpg&quot; alt=&quot;Pack an umbrella, and check the ferry schedule.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4eda8559adae49b89969b3ce27860841.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Pack an umbrella, and check the ferry schedule.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;The storm also hit Okinawa, where Japan&amp;#x27;s Self-Defense Forces were reportedly requested, and caused damage in Taiwan. Jeju-bound travelers should check flights and ferries.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;JUDGMENT&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;Not a debate. Just check the notices.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Not a debate. Just check the notices.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;This is a safety story, so there is no Pro/Con. Check airline and ferry notices before you travel.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;Source: &lt;a href=&quot;https://news.sbs.co.kr/news/programMain.do?prog_cd=R1&amp;broad_date=20261025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SBS 8 News, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;Get KIND free, daily Korea news&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;Subscribe →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t06_cover.jpg&quot; alt=&quot;Retirement Age · Pension&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/792512e6607e4ff8a4aabb7ee4bbbc1a.jpg&#x27;&quot;&gt;&lt;figcaption&gt;Illustration: KIND editorial cartoon · AI-generated (Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;h2&gt;Paris Protests vs. Seoul&amp;#x27;s 88%: Why the Retirement-Age Split?&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;Swipe →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;FACTS&l ;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t10_cover.jpg&quot; alt=&quot;Cruise · Jeju · K-drama&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/327e1530ba234fc48cab781386a52b16.jpg&#x27;&quot;&gt;&lt;figcaption&gt;Illustration: KIND editorial cartoon · AI-generated (Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;h2&gt;730,000 Chinese Cruise Visitors Flock to Korea, Mostly Jeju&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;Swipe →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;FACTS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t10_fact.jpg&quot; alt=&quot;730,000 cruise guests, one island. Jeju says: please queue.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/cbfa35b7af6f4c7fbb40db296bfacef5.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;730,000 cruise guests, one island. Jeju says: please queue.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;A report said 730,000 Chinese visitors arrived by cruise, with Jeju drawing the most. Another report said complaints from K-drama-inspired travelers were higher than for Japan.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;WHY IT MATTERS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t10_bg.jpg&quot; alt=&quot;Dramas promise magic. Reality has queues.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ea885a85201346d787ebcf7fc5868c59.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Dramas promise magic. Reality has queues.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Hallyu-driven tourism is growing, which puts service quality to the test.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ PRO / CON&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;PRO ✔&lt;/b&gt;Supporters point to local spending and jobs.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;CON ✖&lt;/b&gt;Critics point to crowding, uneven spending and service quality.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;JUDGMENT&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;Checking the survey beats guessing.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Checking the survey beats guessing.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Check the original surveys for method and sample size.&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;Source: &lt;a href=&quot;https://www.specialtimes.co.kr/news/articleView.html?idxno=478201&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Special Times Morning Briefing, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;Get KIND free, daily Korea news&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt om/gen/ac8f9c67832741dcabc913a0bcaa0458.jpg&#x27;&quot;&gt;&lt;figcaption&gt;Illustration: KIND editorial cartoon · AI-generated (Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;h2&gt;After Oh Se-hoon&amp;#x27;s Acquittal, Conservatives Debate Leadership&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;Swipe →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;FACTS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t02_fact.jpg&quot; alt=&quot;A verdict, a few kind words, a map redrawn.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b7ccb22302784a1db3ffbe7b13030adc.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;A verdict, a few kind words, a map redrawn.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;After the verdict, Han Dong-hoon called Oh &amp;#x27;very reasonable&amp;#x27; and said conservatives should go together. Separately, Choi Hyung-woo, a former home minister, died at 91 and lawmakers from both camps paid respects.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;WHY IT MATTERS&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t02_bg.jpg&quot; alt=&quot;Parties regroup; voters watch the scoreboard.&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/8e6a442dea5d4d33a968ebb1d1853c62.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;Parties regroup; voters watch the scoreboard.&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;Korean media say the conservative opposition is repositioning. The ruling is one among several factors.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;JUDGMENT&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;Courts and parties decide. 0本 · 各4〜5枚 · 中立・出典付き · Photo cover + satirical cartoons&lt;/div&gt;&lt;div class=&quot;grid&quot;&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t01_cover.jpg&quot; alt=&quot;金正恩 · 丹東&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/46b79b738f7e4842ac98a88e194abf26.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;h2&gt;死亡説の後、金正恩氏が中国に姿&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t01_fact.jpg&quot; alt=&quot;日帰り一回で見出しは千本。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4d8f350125094b2d9c4a35a2c4f3fa39.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;日帰り一回で見出しは千本。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;25日の報道によると、金正恩氏は中国・丹東を日帰りで訪問しました。習近平氏とは会わず、序列4位の王滬寧氏と会談し、朝鮮戦争の記念館も訪れました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t01_bg.jpg&quot; alt=&quot;制裁も橋も、みんな行間を読んでいます。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/e1333c238c424bf99257cf92cee1bf43.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;制裁も橋も、みんな行間を読んでいます。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;北中関係は制裁の運用や朝鮮半島の安全保障に影響します。韓国メディアは新鴨緑江大橋を経済協力拡大の契機として伝えました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 賛成 / 反対&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;賛成 ✔&lt;/b&gt;対話の窓口が回復すれば地域の緊張管理に役立つ(一部専門家)。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;反対 ✖&lt;/b&gt;貿易拡大は制裁の実効性を弱めかねない(一部専門家)。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;未確認の部分、推測は控えめに。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;未確認の部分、推測は控えめに。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;会談の格や後続合意は公式確認されていません。解釈は暫定的に。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://news.sbs.co.kr/news/programMain.do?prog_cd=R1&amp;broad_date=20261025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SBS 8 News, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t05_cover.jpg&quot; alt=&quot;台風チャンピ · 済州&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/999328fc484a4969b6d8e8148c2da908.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;h2&gt;台風チャンピ、済州に史上最も遅い台風警報&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t05_fact.jpg&quot; alt=&quot;史上最も遅い台風警報。天気も遅刻?&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/a716a874bc7742e4be6512e8b137bef7.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;史上最も遅い台風警報。天気も遅刻?&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;SBSは済州で340ミリの豪雨があり、台風警報としては最も遅い時期の発令と伝えました。台風は約250キロまで接近しました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t05_bg.jpg&quot; alt=&quot;傘と一緒に運航情報もチェック。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4eda8559adae49b89969b3ce27860841.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;傘と一緒に運航情報もチェック。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;沖縄では自衛隊への要請が報じられ、台湾でも被害が出ました。済州行きの方は航空便・船便の確認を。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;議論ではなく安全確認を。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;議論ではなく安全確認を。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;安全に関わる話題のためPro/Conはありません。出発前に運航情報を確認してください。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://news.sbs.co.kr/news/programMain.do?prog_cd=R1&amp;broad_date=20261025&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SBS 8 News, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t13_cover.jpg&quot; alt=&quot;K-ドラマ · 旅行&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/3bd9d10917014bcd952739ceb5b8bfa3.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;h2&gt;「Kドラマを見て来たのにがっかり」旅行の不満、日本より高い&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t13_fact.jpg&quot; alt=&quot;ドラマの魔法、現実は行列。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/50f20d8a579147ec8f9eb6aad93867aa.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;ドラマの魔法、現実は行列。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;報道によると、Kドラマを見て韓国を訪れた旅行者の不満は日本より高かったとされます。同じ日、中国人クルーズ客73万人が韓国を訪れ、済州に集中したとも伝えられました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t13_bg.jpg&quot; alt=&quot;韓流観光は人気とサービスの両立が課題。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1f9e342e29c444aaa0396e8e06b65320.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;韓流観光は人気とサービスの両立が課題。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;韓流観光が伸びるなか、サービス品質が問われています。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 賛成 / 反対&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;賛成 ✔&lt;/b&gt;地元消費と雇用への効果を評価する声。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;反対 ✖&lt;/b&gt;混雑や消費の偏り、品質を指摘する声。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;調査の方法を確かめてから拍手を。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;調査の方法を確かめてから拍手を。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;調査の方法・対象は原文でご確認ください。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://www.specialtimes.co.kr/news/articleView.html?idxno=478201&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Special Times Morning Briefing, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t09_cover.jpg&quot; alt=&quot;モバイルバッテリー · 機内&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/a15d8b7596dc43de8c2676c796555a62.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;h2&gt;機内でバッグから煙 香港エクスプレス済州行き&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t09_fact.jpg&quot; alt=&quot;機内でバッグがモクモク。バッテリーも主張したい?&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/e60d2c8b03474887814ad7824abdae48.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;機内でバッグがモクモク。バッテリーも主張したい?&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;25日、香港から済州へ向かう便でモバイルバッテリーが発熱し、乗客1人が指にやけどを負いました。243人が搭乗していました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t09_bg.jpg&quot; alt=&quot;手荷物で持ち込むのが旅のルール。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/8941efe1f4e948d0a1332e028d7268c9.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;手荷物で持ち込むのが旅のルール。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;日本でも機内のモバイルバッテリーの扱いが注目されています。多くの航空会社は手荷物での持ち込みに制限しています。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 賛成 / 反対&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;賛成 ✔&lt;/b&gt;機内での保管・使用ルールを強化すべきだという立場。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;反対 ✖&lt;/b&gt;過度な規制より乗客への周知が先だという立場。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;原因は調査中。規則に従いましょう。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;原因は調査中。規則に従いましょう。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;原因は調査中です。ご利用の航空会社の規則に従いましょう。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://dazabi.com/news/daily-report.php?date=2026-10-26&amp;edition=daily&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Dazabi Daily Report, Oct 26 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t11_cover.jpg&quot; alt=&quot;TWICE ナヨン · 映画&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/2b6f87b545ee4509933ffc7e15733bdb.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;h2&gt;K-カルチャー: ナヨン新曲「NA-sty」と映画ランキング&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t11_fact.jpg&quot; alt=&quot;11月20日の新曲、ファンの予定は準備万端。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b5f8f898d4e943f3a86445cf3a067b36.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;11月20日の新曲、ファンの予定は準備万端。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;TWICEのナヨンが11月20日にシングル「NA-sty」を発売します。ク・ギョファン主演の映画「復活男: ザ・レッド」は累計31万6,523人で11位です。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t11_bg.jpg&quot; alt=&quot;順位は瞬間の写真、判決ではありません。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/7bbdde44d7aa46bfbda057af89f63791.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;順位は瞬間の写真、判決ではありません。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;いずれも25日付の報道です。韓国国内でのK-コンテンツの伝え方が分かります。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;順位は毎日変わります。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;順位は毎日変わります。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;順位は25日時点の報道で、日々変わります。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://www.specialtimes.co.kr/news/articleView.html?idxno=478201&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Special Times Morning Briefing, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t06_cover.jpg&quot; alt=&quot;定年延長 · 年金&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/792512e6607e4ff8a4aabb7ee4bbbc1a.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;h2&gt;パリの大規模デモと韓国の88%賛成 定年延長の温度差&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t06_fact.jpg&quot; alt=&quot;パリはデモ、ソウルは88%賛成。同じ問いでも空模様が違う。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b018c1e64a11494cba02ef87a886208b.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;パリはデモ、ソウルは88%賛成。同じ問いでも空模様が違う。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;SBSはフランスで禁止にもかかわらず約41万人が集まったと伝えました。韓国では定年延長に88%が賛成という報道もありました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t06_bg.jpg&quot; alt=&quot;高齢化は共通、いつ・どうするかは別問題。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ffbbc12202c94dd599e81ca9c3b0aadc.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;高齢化は共通、いつ・どうするかは別問題。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;日本でも高齢化と定年が身近なテーマです。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 賛成 / 反対&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;賛成 ✔&lt;/b&gt;働く期間を延ばせば所得の空白を減らし、熟練人材を活かせる。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;反対 ✖&lt;/b&gt;若者の雇用減や企業の人件費負担を懸念する声。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;設問を読んでから拍手を。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;設問を読んでから拍手を。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;設問の書き方で結果は変わります。原文調査を確認しましょう。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=sisa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nate Rankings (General), Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t07_cover.jpg&quot; alt=&quot;暗号資産課税 · サムスン&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/9ca1939934e848a584be8b3981f21ba2.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;h2&gt;暗号資産課税、再猶予を検討&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t07_fact.jpg&quot; alt=&quot;暗号資産課税、またスヌーズ?&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c50cb63ccdac471b984979f0d1c7cd1f.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;暗号資産課税、またスヌーズ?&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;ハン・ドンフン氏は暗号資産課税の再猶予を歓迎し、大統領府は検討中と伝えられました。サムスン電子の来年の配当は1株1万2,000ウォン、楽観時は1万8,000ウォンとの予想です。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t07_bg.jpg&quot; alt=&quot;世界の投資家、ニュース更新ボタンを連打中。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/5216e47524d54031bb5317916ee359b4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;世界の投資家、ニュース更新ボタンを連打中。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;アジア市場を追う投資家にも関係する話題です。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 賛成 / 反対&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;賛成 ✔&lt;/b&gt;市場整備と投資家保護に時間が要るという立場。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;反対 ✖&lt;/b&gt;課税の公平のため予定通り実施すべきだという立場。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;未決定。噂で売買しないで。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;未決定。噂で売買しないで。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;決定は発表されていません。公式発表を待ちましょう。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://www.specialtimes.co.kr/news/articleView.html?idxno=478201&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Special Times Morning Briefing, Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t08_cover.jpg&quot; alt=&quot;若者 · 収入 · ソウル&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/bd770be1436441948a764b9fdbba8b41.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;&lt;h2&gt;「ソウルに行ったら年収2,166万→4,820万ウォン」&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t08_fact.jpg&quot; alt=&quot;大都市は給料も大きく、故郷は待っています。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/963f83ee849d49659d796310dc982983.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;大都市は給料も大きく、故郷は待っています。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;首都圏に移った若者の収入が2,166万ウォンから4,820万ウォンになったとの報道がありました。若者1,000人調査では56.5%が企業規模より労働条件を優先しました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t08_bg.jpg&quot; alt=&quot;仕事は都会、故郷は遠く。綱引きの定番です。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/423e558edf2e4a968b0e8d7f19f99c4c.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;仕事は都会、故郷は遠く。綱引きの定番です。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;日本でも若者の収入と地方の人口が課題です。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;⚖ 賛成 / 反対&lt;/div&gt;&lt;div class=&quot;pcw&quot;&gt;&lt;div class=&quot;pcr p&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_pro.jpg&quot; alt=&quot;PRO&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/4fbf740b82d245b690352b3e88226e7e.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;賛成 ✔&lt;/b&gt;首都圏の仕事は収入増の機会になる。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pcr c&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_con.jpg&quot; alt=&quot;CON&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/1569026e9bc949488233221af299c02b.jpg&#x27;&quot;&gt;&lt;div class=&quot;pcx&quot;&gt;&lt;b&gt;反対 ✖&lt;/b&gt;首都圏集中が地方の衰退を招くという懸念。&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;誰を数えたデータか確認を。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;誰を数えたデータか確認を。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;誰を対象にした数字か、原文を確認しましょう。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=sisa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nate Rankings (General), Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t14_cover.jpg&quot; alt=&quot;夜道の安全 · 労働安全&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ef858331cb4e4de0ab1e55be999bb2bb.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;09&lt;/div&gt;&lt;h2&gt;「夜道が安全だった韓国、どうして」 体感治安が話題に&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t14_fact.jpg&quot; alt=&quot;夜道は安全でも、体感と統計は別物。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/7ddf03a0776348ce8c1005008cac0b73.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;夜道は安全でも、体感と統計は別物。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;昌原で特別勤務を終えた40代の社員が、建物から落ちた約60キロの部品に当たり亡くなったと報じられました。同日「夜道が安全だった韓国」という記事も注目されました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t14_bg.jpg&quot; alt=&quot;旅行者ほど気になる安心の話。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/94dfffffb995482c873839cb5e72c77b.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;旅行者ほど気になる安心の話。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;旅行や留学で韓国を訪れる方の関心が高いテーマです。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;公式統計を確認しましょう。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;公式統計を確認しましょう。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;体感と統計は別です。公式統計を確認しましょう。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=sisa&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nate Rankings (General), Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;car&quot;&gt;&lt;div class=&quot;track&quot; contenteditable=&quot;true&quot;&gt;&lt;section class=&quot;s cv&quot;&gt;&lt;figure&gt;&lt;img src=&quot;img/kind_102626_t02_cover.jpg&quot; alt=&quot;呉世勲 · 保守&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/ac8f9c67832741dcabc913a0bcaa0458.jpg&#x27;&quot;&gt;&lt;figcaption&gt;イラスト: KIND 風刺漫画 · AI生成(Magica)&lt;/figcaption&gt;&lt;/figure&gt;&lt;div class=&quot;num&quot;&gt;10&lt;/div&gt;&lt;h2&gt;呉世勲氏の無罪後、保守の中心を巡る動き&lt;/h2&gt;&lt;div class=&quot;hint&quot;&gt;スワイプ →&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;事実&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t02_fact.jpg&quot; alt=&quot;判決、やさしい言葉、描き直される地図。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/b7ccb22302784a1db3ffbe7b13030adc.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;判決、やさしい言葉、描き直される地図。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;無罪判決を受け、ハン・ドンフン氏は呉氏を「非常に合理的」と評し、保守勝利のために共にと述べました。別に、元内務部長官チェ・ヒョンウ氏が91歳で死去し、与野党が弔問しました。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;背景&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_t02_bg.jpg&quot; alt=&quot;政党は再編、有権者は成績表を見守る。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/8e6a442dea5d4d33a968ebb1d1853c62.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;政党は再編、有権者は成績表を見守る。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;韓国メディアは保守陣営の再編を伝えています。判決は要因の一つです。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;s&quot;&gt;&lt;div class=&quot;lb&quot;&gt;判断&lt;/div&gt;&lt;figure class=&quot;cm&quot;&gt;&lt;img src=&quot;img/kind_102626_shared_judge.jpg&quot; alt=&quot;決めるのは裁判所と政党。私たちは事実に。&quot; loading=&quot;lazy&quot; onerror=&quot;this.onerror=null;this.src=&#x27;https://g.tlcdn.com/gen/c9fec626ed424f3e9914a200b1d7d9a4.jpg&#x27;&quot;&gt;&lt;figcaption class=&quot;bub&quot;&gt;決めるのは裁判所と政党。私たちは事実に。&lt;/figcaption&gt;&lt;/figure&gt;&lt;p&gt;今後は裁判所と政党が決めます。確認された事実にとどめましょう。&lt;/p&gt;&lt;div class=&quot;src&quot;&gt;出典: &lt;a href=&quot;https://m.news.nate.com/rank/list?date=20261025&amp;mid=m2001&amp;rmode=interest&amp;section=pol&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nate Rankings (Politics), Oct 25 2026&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;cta&quot;&gt;毎日の韓国ニュースを無料で&lt;a class=&quot;btn&quot; href=&quot;#&quot;&gt;購読する →&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;button class=&quot;ar l&quot; aria-label=&quot;prev&quot;&gt;‹&lt;/button&gt;&lt;button class=&quot;ar r&quot; aria-label=&quot;next&quot;&gt;›&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;script&gt;document.querySelectorAll(&#x27;.car&#x27;).forEach(c=&gt;{const t=c.querySelector(&#x27;.track&#x27;),d=[...c.querySelectorAll(&#x27;.dots i&#x27;)];const u=()=&gt;{const i=Math.round(t.scrollLeft/t.clientWidth);d.forEach((x,j)=&gt;x.classList.toggle(&#x27;on&#x27;,j==i))};t.addEventListener(&#x27;scroll&#x27;,u);u();c.querySelector(&#x27;.l&#x27;).onclick=()=&gt;t.scrollBy({left:-t.clientWidth,behavior:&#x27;smooth&#x27;});c.querySelector(&#x27;.r&#x27;).onclick=()=&gt;t.scrollBy({left:t.clientWidth,behavior:&#x27;smooth&#x27;})});&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
<script>document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bar button,.fr').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('f_'+b.dataset.t).classList.add('on')})</script></body></html>
