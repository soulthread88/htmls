<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IssueLens EP.01-5 — 지금 당장 할 수 있는 것</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0a0a;font-family:'Noto Sans KR',sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 16px;
}
.card{
  position:relative;width:390px;height:693px;
  overflow:hidden;box-shadow:0 28px 72px rgba(0,0,0,.9);
  display:flex;flex-direction:column;
}

/* 상단 바 */
.top-bar{
  width:100%;background:#CC0000;height:160px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
}
.top-bar::after{content:'';position:absolute;right:-30px;top:-40px;width:130px;height:220px;background:rgba(255,255,255,.07);transform:rotate(18deg);}
.top-bar::before{content:'';position:absolute;left:-20px;bottom:-30px;width:100px;height:160px;background:rgba(0,0,0,.15);transform:rotate(18deg);}
.top-text{
  font-size:46px;font-weight:900;color:#fff;
  text-align:center;text-shadow:2px 3px 0 rgba(0,0,0,.45);
  letter-spacing:-.02em;line-height:1.18;padding:0 18px;
  word-break:keep-all;position:relative;z-index:2;
}

/* 중앙 */
.mid{
  flex:1;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;
  background:
    radial-gradient(ellipse 60% 45% at 20% 60%, rgba(0,100,80,.5) 0%, transparent 68%),
    radial-gradient(ellipse 65% 50% at 80% 30%, rgba(150,50,0,.55) 0%, transparent 70%),
    #060a09;
}
.deco-circle{
  position:absolute;width:210px;height:210px;border-radius:50%;
  top:50%;left:10%;transform:translateY(-50%);
  background:rgba(0,160,100,.4);opacity:.35;pointer-events:none;
}
.deco-rect{
  position:absolute;width:160px;height:240px;
  top:6%;right:-20px;transform:rotate(11deg);
  background:rgba(0,30,20,.9);opacity:.18;pointer-events:none;
}

/* 체크리스트 일러스트 */
.checklist{
  position:absolute;top:50%;left:3%;
  transform:translateY(-50%) rotate(-4deg);
  width:136px;
  pointer-events:none;z-index:2;
  display:flex;flex-direction:column;gap:10px;
  background:rgba(255,255,255,.03);
  border:1.5px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:14px 14px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.cl-title{
  font-size:9px;font-weight:900;color:rgba(255,255,255,.4);
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:2px;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding-bottom:6px;
}
.cl-item{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;color:rgba(255,255,255,.78);
}
.cl-box{
  width:18px;height:18px;border-radius:5px;
  background:#00c875;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:11px;color:#fff;
  box-shadow:0 2px 6px rgba(0,200,117,.35);
}

/* 메인 텍스트 */
.main-block{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;margin-left:26px;
}
.m-line{
  font-weight:900;letter-spacing:-.02em;line-height:1.12;
  text-shadow:3px 3px 0 rgba(0,0,0,.9),-1px -1px 0 rgba(0,0,0,.5);
  word-break:keep-all;
}
.m-line.num{color:#fff;font-size:40px}
.m-line.yellow{color:#FFD700;font-size:58px}
.m-line.white{color:#fff;font-size:36px}

/* 번호 뱃지 */
.num-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;
  background:#00c875;
  font-size:18px;font-weight:900;color:#fff;
  box-shadow:0 3px 10px rgba(0,200,117,.4);
  margin-bottom:4px;
}

/* 하단 바 */
.bot-bar{
  width:100%;background:#CC0000;height:160px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;flex-shrink:0;position:relative;overflow:hidden;
}
.bot-bar::before{content:'';position:absolute;left:-30px;top:-30px;width:120px;height:200px;background:rgba(255,255,255,.06);transform:rotate(18deg);}
.bot-line{
  font-size:32px;font-weight:900;color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.45);
  text-align:center;letter-spacing:-.02em;line-height:1.28;
  padding:0 12px;word-break:keep-all;position:relative;z-index:2;
}
.bot-line .acc{color:#FFD700}

.ep-badge{
  position:absolute;top:14px;right:14px;
  background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.18);
  border-radius:20px;padding:4px 12px;
  font-size:11px;font-weight:900;color:rgba(255,255,255,.7);
  letter-spacing:.1em;z-index:20;pointer-events:none;
}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <div class="top-text">지금 당장<br>할 수 있는 것</div>
  </div>
  <div class="mid">
    <div class="deco-circle"></div>
    <div class="deco-rect"></div>
    <div class="checklist">
      <div class="cl-title">Action List</div>
      <div class="cl-item"><div class="cl-box">✓</div>앱 삭제</div>
      <div class="cl-item"><div class="cl-box">✓</div>권한 차단</div>
      <div class="cl-item"><div class="cl-box">✓</div>국내 플랫폼</div>
      <div class="cl-item"><div class="cl-box">✓</div>가족 공유</div>
    </div>
    <div class="main-block">
      <div class="num-badge">4</div>
      <div class="m-line yellow">가지</div>
      <div class="m-line white">지금 바로</div>
      <div class="m-line white" style="font-size:32px">실천하세요</div>
    </div>
  </div>
  <div class="bot-bar">
    <div class="bot-line">알아야</div>
    <div class="bot-line"><span class="acc">지킬 수 있습니다</span></div>
  </div>
  <div class="ep-badge">EP.01 · #5</div>
</div>

<style>
.dl-btn{
  position:fixed;bottom:20px;right:20px;z-index:999;
  background:#CC0000;color:#fff;border:none;border-radius:10px;
  padding:12px 22px;font-family:'Noto Sans KR',sans-serif;
  font-size:15px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.5);letter-spacing:.04em;
  transition:opacity .15s;
}
.dl-btn:hover{opacity:.85}
.dl-btn:active{transform:scale(.97)}
</style>
<button class="dl-btn" id="dlBtn">📥 PNG 저장</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
document.getElementById("dlBtn").addEventListener("click",function(){
  var btn=this;btn.textContent="캡처 중...";btn.disabled=true;
  var card=document.querySelector(".card");
  html2canvas(card,{
    scale:3,
    useCORS:true,
    backgroundColor:null,
    width:card.offsetWidth,
    height:card.offsetHeight,
    logging:false
  }).then(function(canvas){
    var a=document.createElement("a");
    a.download=document.title.replace(/\s+/g,"_")+".png";
    a.href=canvas.toDataURL("image/png");
    a.click();
    btn.textContent="📥 PNG 저장";btn.disabled=false;
  });
});
</script>
</body>
</html>
